[package]
name = "sinteract"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Draw-list based 2D graphics with terminal (Kitty/Sixel/half-blocks) and PDF outputs. Originated in spython; designed to be shared with sgleam."
repository = "https://github.com/malbarbo/sinteract"
readme = "README.md"

[features]
default = ["native-fonts", "render", "terminal", "window"]
# The pixmap and PDF renderers and the Sixel encoder. Without it, a server
# that only encodes and decodes messages keeps the scene, the text, the SVG
# renderer and the codec.
render = ["dep:tiny-skia", "dep:png", "dep:pdf-writer", "dep:icy_sixel"]
# Look up a family the embedded fonts do not cover among the fonts installed
# on the system. Turning it off drops fontdb and leaves only the embedded
# families. The query needs a font directory, so wasm32 leaves it out even
# when the feature is on.
native-fonts = ["dep:fontdb"]
# The displays that show a scene. With both off, `Stdio` is the only
# display, and a build that only talks stdio, such as a server, drops
# crossterm, winit and softbuffer. `open_native` needs both, since it falls
# back from the window to the terminal.
terminal = [
    "render",
    "dep:crossterm",
    "dep:vtparse",
    "dep:base64",
    "dep:libc",
    "dep:windows-sys",
]
window = ["render", "dep:winit", "dep:softbuffer", "dep:libc"]

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"], optional = true }
kurbo = { version = "0.13", default-features = false, features = ["std"] }
# The bindings for the files in schema/ are generated offline and committed
# in src/wire/*_capnp.rs, so the build does not need the capnp CLI.
capnp = "0.25"
# These make no syscalls, so text and pdf build on wasm too.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
pdf-writer = { version = "0.14", optional = true }
# Pure Rust, so the Sixel encoder builds on wasm too. The fork adds the
# encoder that keeps its buffers between frames. Go back to the release
# once it has the change. Cargo.lock is not in the repository, so the
# revision is pinned here.
icy_sixel = { git = "https://github.com/malbarbo/icy_sixel", rev = "b2dcf9a0e2d1eacc93f6444594cdd8b0a891de9b", optional = true }
# Decodes an asset, through tiny-skia, and encodes the Kitty frame. The
# terminal reads a PNG fifty times faster than the raw pixels, which arrive
# in base64.
png = { version = "0.18", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { version = "0.23", optional = true }
crossterm = { version = "0.29", optional = true, default-features = false, features = ["windows"] }
# Parses what the terminal sends, the replies to the probe in term_query and
# the keys in vt_input.
vtparse = { version = "0.6", optional = true }
base64 = { version = "0.22", optional = true }
winit = { version = "0.30", optional = true, default-features = false, features = [
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
    "rwh_06",
] }
softbuffer = { version = "0.4", optional = true, default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# examples/view.rs hands the engine fd 3 and fd 4.
[target.'cfg(unix)'.dev-dependencies]
command-fds = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[lib]
name = "sinteract"
path = "src/lib.rs"

[[example]]
name = "view"
required-features = ["terminal", "window"]

[[example]]
name = "gallery"
required-features = ["terminal", "window"]

[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
