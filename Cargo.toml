[package]
name = "sinteract"
version = "0.1.0"
edition = "2024"
license = "(MIT OR Apache-2.0) AND OFL-1.1"
description = "Draw-list based 2D graphics with terminal (Kitty/Sixel/half-blocks) and PDF outputs. Originated in spython; designed to be shared with sgleam."
repository = "https://github.com/malbarbo/sinteract"
readme = "README.md"

[features]
default = ["native-fonts", "render", "terminal", "window"]
# The pixmap and PDF renderers, and the canvas renderer on wasm32. Without
# it, a server that only encodes and decodes messages keeps the scene, the
# text, the SVG renderer and the codec.
render = [
    "dep:tiny-skia",
    "dep:png",
    "dep:image",
    "dep:pdf-writer",
    "dep:miniz_oxide",
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:web-sys",
]
# Look up a family the embedded fonts do not cover among the fonts installed
# on the system. Turning it off drops fontdb and leaves only the embedded
# families. The query needs a font directory, so wasm32 leaves it out even
# when the feature is on.
native-fonts = ["dep:fontdb"]
# The displays that show a scene. A build with both off, such as a server,
# has no display and drops crossterm, winit and softbuffer. `open_native`
# needs both, since it falls back from the window to the terminal.
terminal = [
    "render",
    "dep:icy_sixel",
    "dep:crossterm",
    "dep:vtparse",
    "dep:libc",
    "dep:windows-sys",
]
window = ["render", "dep:winit", "dep:softbuffer", "dep:libc", "dep:objc2"]

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"], optional = true }
kurbo = { version = "0.13", default-features = false, features = ["std"] }
# The terminal sends a Kitty frame, and svg embeds an image, in base64.
base64 = "0.22"
# The bindings for the files in schema/ are generated offline and committed
# in src/wire/*_capnp.rs, so the build does not need the capnp CLI.
capnp = "0.25"
# These make no syscalls, so text and pdf build on wasm too.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
pdf-writer = { version = "0.14", optional = true }
# Compresses the pixels of an image in a PDF. png already depends on it.
miniz_oxide = { version = "0.8", optional = true }
# Pure Rust, so the Sixel encoder builds on wasm too. The fork adds the
# encoder that keeps its buffers between frames. Go back to the release
# once it has the change. Cargo.lock is not in the repository, so the
# revision is pinned here.
icy_sixel = { git = "https://github.com/malbarbo/icy_sixel", rev = "b2dcf9a0e2d1eacc93f6444594cdd8b0a891de9b", optional = true }
# Decodes an asset, through tiny-skia, and encodes the Kitty frame. The
# terminal reads a PNG fifty times faster than the raw pixels, which arrive
# in base64.
png = { version = "0.18", optional = true }
# Decodes an asset of any of the formats that asset::image_size reads. All
# four decoders are pure Rust, so they build on wasm too.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }

# The canvas renderer draws with the Canvas 2D API of a browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "CanvasWindingRule",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "Path2d",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { version = "0.23", optional = true }
crossterm = { version = "0.29", optional = true, default-features = false, features = ["windows"] }
# Parses what the terminal sends, the replies to the probe in term_query and
# the keys in vt_input.
vtparse = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true, default-features = false, features = [
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
    "rwh_06",
] }
softbuffer = { version = "0.4", optional = true, default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }

# The display link of the view of a window, which paces the ticks of the
# window on macOS. softbuffer already builds it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# examples/view.rs hands the engine fd 3 and fd 4.
[target.'cfg(unix)'.dev-dependencies]
command-fds = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[lib]
name = "sinteract"
path = "src/lib.rs"

[[example]]
name = "view"
required-features = ["terminal", "window"]

# It draws its paddle with tiny-skia and encodes it with png, and shows
# the game itself when no view runs it.
[[example]]
name = "engine"
required-features = ["terminal", "window"]

[[example]]
name = "gallery"
required-features = ["terminal", "window"]

# The library panics only through an expect or an assert that states an
# invariant.
[lints.clippy]
unwrap_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
