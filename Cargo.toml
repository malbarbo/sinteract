[package]
name = "sinteract"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Draw-list based 2D graphics with terminal (Kitty/Sixel/half-blocks) and PDF outputs. Originated in spython; designed to be shared with sgleam."
repository = "https://github.com/malbarbo/sinteract"
readme = "README.md"

[features]
default = ["native-fonts"]
# Look up a family the embedded fonts do not cover among the fonts installed
# on the system. Turning it off drops fontdb and leaves only the embedded
# families. The query needs a font directory, so wasm32 leaves it out even
# when the feature is on.
native-fonts = ["dep:fontdb"]

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
kurbo = { version = "0.13", default-features = false, features = ["std"] }
# The bindings for the files in schema/ are generated offline and committed
# in src/wire/*_capnp.rs, so the build does not need the capnp CLI.
capnp = "0.25"
# These make no syscalls, so text and pdf build on wasm too.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
pdf-writer = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdb = { version = "0.23", optional = true }
crossterm = "0.29"
base64 = "0.22"
winit = { version = "0.30", default-features = false, features = [
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
    "rwh_06",
] }
softbuffer = { version = "0.4", default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[lib]
name = "sinteract"
path = "src/lib.rs"
