[package]
name = "sinteract-test-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "A server to test the HTML client of sinteract with one room and one engine."

[dependencies]
sinteract = { path = "../..", default-features = false }
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
command-fds = { version = "0.3", features = ["tokio"] }
futures = "0.3"
rand = "0.9"
tokio = { version = "1", features = ["full"] }
