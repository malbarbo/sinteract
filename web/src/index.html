<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sinteract</title>
    <link rel="icon" href="data:,">
    <style>
    /* The fonts of the engine, which the server serves beside the page. */
    @font-face {
      font-family: "Sinteract Sans";
      src: url("fonts/SinteractSans-Regular.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: "Sinteract Sans";
      src: url("fonts/SinteractSans-Bold.woff2") format("woff2");
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: "Sinteract Sans";
      src: url("fonts/SinteractSans-Italic.woff2") format("woff2");
      font-weight: normal;
      font-style: italic;
    }
    @font-face {
      font-family: "Sinteract Sans";
      src: url("fonts/SinteractSans-BoldItalic.woff2") format("woff2");
      font-weight: bold;
      font-style: italic;
    }
    @font-face {
      font-family: "Sinteract Serif";
      src: url("fonts/SinteractSerif-Regular.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: "Sinteract Serif";
      src: url("fonts/SinteractSerif-Bold.woff2") format("woff2");
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: "Sinteract Serif";
      src: url("fonts/SinteractSerif-Italic.woff2") format("woff2");
      font-weight: normal;
      font-style: italic;
    }
    @font-face {
      font-family: "Sinteract Serif";
      src: url("fonts/SinteractSerif-BoldItalic.woff2") format("woff2");
      font-weight: bold;
      font-style: italic;
    }
    @font-face {
      font-family: "Sinteract Mono";
      src: url("fonts/SinteractMono-Regular.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: "Sinteract Mono";
      src: url("fonts/SinteractMono-Bold.woff2") format("woff2");
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: "Sinteract Mono";
      src: url("fonts/SinteractMono-Italic.woff2") format("woff2");
      font-weight: normal;
      font-style: italic;
    }
    @font-face {
      font-family: "Sinteract Mono";
      src: url("fonts/SinteractMono-BoldItalic.woff2") format("woff2");
      font-weight: bold;
      font-style: italic;
    }
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #ddd;
      font: 16px system-ui, sans-serif;
      overflow: hidden;
    }
    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      touch-action: none;
    }
    #status {
      position: fixed;
      inset: auto 0 1rem 0;
      display: flex;
      justify-content: center;
      gap: 1rem;
      align-items: center;
    }
    #status[hidden] {
      display: none;
    }
    #status > * {
      background: rgb(0 0 0 / 70%);
      padding: 0.4rem 0.8rem;
      border-radius: 0.4rem;
    }
    #reconnect {
      color: inherit;
      font: inherit;
      border: 1px solid #666;
      cursor: pointer;
    }
    </style>
  </head>
  <body>
    <canvas id="stage" tabindex="0"></canvas>
    <div id="status">
      <span id="message">connecting…</span>
      <button id="reconnect" hidden>reconnect</button>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
